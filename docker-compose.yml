version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trama_abierta}
      POSTGRES_USER: ${POSTGRES_USER:-trama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example-password-change-me-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bloquear expuesto; solo loopback local (limitado)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trama} -d ${POSTGRES_DB:-trama_abierta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: trama_abierta:latest
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "src.core.migrate", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-trama}:${POSTGRES_PASSWORD:-example-password-change-me-local-only}@db:5432/${POSTGRES_DB:-trama_abierta}"
      TRAMA_ABIERTA_SECRET_KEY: development-only-key
      PYTHONUNBUFFERED: 1
    restart: "no"

  api:
    image: trama_abierta:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-trama}:${POSTGRES_PASSWORD:-example-password-change-me-local-only}@db:5432/${POSTGRES_DB:-trama_abierta}"
      TRAMA_ABIERTA_SECRET_KEY: development-only-key
      TRAMA_DEMO_MODE: "true"
      CORS_ALLOW_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

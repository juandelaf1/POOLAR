[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["src/core/alembic/versions", "src/core/migrations", ".venv", "test_check.db"]

[tool.ruff.lint]
# Config mínima compatible con estado actual: solo errores graves/indefinidos.
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = false
show_error_codes = true
exclude = '(src/core/alembic/versions|src/core/migrations)'
# Baseline no bloqueante: ejecutar con `mypy src` y tratar hallazgos gradualmente.
